name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the publishing job widens this for itself only.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Angular 22 declares engines ^22.22.3 || ^24.15.0 || >=26.0.0, so the
      # major is pinned rather than left to the runner's default.
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      # Both workspaces are named explicitly. The root `npm test` script only
      # runs the API suite, so relying on it here would silently skip the 39
      # web specs and still report success.
      - name: API tests
        run: npm test --workspace=api

      - name: Web tests
        run: npm test --workspace=web

      # The suites pass with a broken application build — that happened in this
      # repo and survived two reviews — so the build is its own gate.
      - name: Web build
        run: npm run build --workspace=web

  image:
    name: Image — build, smoke test, publish
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Tagged with the commit up front, so the artifact that gets smoke-tested
      # below is the exact artifact that gets pushed — not a second build from
      # the same source.
      - name: Build image
        run: docker build -t "$IMAGE:${{ github.sha }}" .

      # The image's default mode is mock, so it must serve the demo with no LMS,
      # no token and no configuration. Starting it is the only way to catch a
      # runtime dependency that a production-only install left behind — which is
      # a bug this repo actually shipped.
      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 3000:3000 "$IMAGE:${{ github.sha }}"
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3000/api/config >/dev/null && break
            sleep 1
          done
          echo "--- /api/config ---"
          curl -sf http://localhost:3000/api/config | tee /dev/stderr | grep -q '"mode":"mock"'
          echo "--- / (the built Angular app) ---"
          curl -sf -o /dev/null -w '%{http_code}\n' http://localhost:3000/ | grep -q '^200$'
          echo "--- a below-threshold run must come back fail ---"
          curl -sf -X POST \
            http://localhost:3000/api/session/b3f1c9e2-4a17-4c0e-9f31-8a2d5e77b101/result \
            -H 'content-type: application/json' \
            -d '{"answers":{"c1":"yes","c2":"yes","c3":"yes","c4":"no","c5":"yes","c6":"yes","c7":"yes","c8":"yes"}}' \
            | tee /dev/stderr | grep -q '"status":"fail"'

      # Mounting a config directory is the supported way to hand the container secrets,
      # so it is a gate: the file has to be read, and the mount must not shadow anything.
      # Aiming the same mount under /app/api instead is what produced
      # `Cannot find module '/app/api/src/index.js'` — which is why /app/config exists.
      - name: Smoke test a mounted config directory
        run: |
          mkdir -p ci-secrets
          printf 'LMS_BASE_URL=https://lms.example.com\nLMS_API_TOKEN=ci-token\n' > ci-secrets/.env
          docker run -d --name mounted -p 3001:3000 \
            -v "$PWD/ci-secrets:/app/config" "$IMAGE:${{ github.sha }}"
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3001/api/config >/dev/null && break
            sleep 1
          done
          echo "--- /api/config with a mounted config dir ---"
          curl -sf http://localhost:3001/api/config | tee /dev/stderr | grep -q '"mode":"live"'

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs smoke || true
          docker logs mounted || true

      - name: Stop containers
        if: always()
        run: docker rm -f smoke mounted || true

      # Everything below runs only for a real push to main: pull requests build
      # and smoke-test the image but never publish, so a fork's PR cannot push.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "published $IMAGE:${{ github.sha }} and :latest" >> "$GITHUB_STEP_SUMMARY"
